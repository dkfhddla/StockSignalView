[project]
name = "stock-signal-view-backend"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi[standard]>=0.136,<0.137",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.4,<3",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
